name: Build RazeLess

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the build to (for example 1.0.0); leave blank to build only"
        required: false
        type: string
        default: ""
  release:
    types: [published, edited]
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish standalone Windows app
        run: >-
          dotnet publish DeathAdderManager/DeathAdderManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath RazeLess-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RazeLess-win-x64
          path: RazeLess-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach build to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: RazeLess-win-x64.zip
