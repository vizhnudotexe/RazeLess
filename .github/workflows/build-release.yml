name: Build RazeLess

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach this build to an existing release tag (for example 1.0.0); leave blank to create a build release"
        required: false
        type: string
        default: ""
  release:
    types: [published, edited]
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish standalone Windows app
        run: >-
          dotnet publish DeathAdderManager/DeathAdderManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath RazeLess-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RazeLess-win-x64
          path: |
            RazeLess-win-x64.zip
            publish/DeathAdderManager2.exe
          if-no-files-found: error
          retention-days: 14

      - name: Choose release tag
        id: release-tag
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:INPUT_RELEASE_TAG) {
            $tag = $env:INPUT_RELEASE_TAG
          } elseif ($env:EVENT_RELEASE_TAG) {
            $tag = $env:EVENT_RELEASE_TAG
          } elseif ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME
          } else {
            $tag = "build-$env:RUN_NUMBER"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Attach EXE and ZIP to GitHub Release
        if: github.event_name == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RazeLess ${{ steps.release-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            publish/DeathAdderManager2.exe
            RazeLess-win-x64.zip
